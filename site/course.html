<!doctype html>
<html lang="en">
<head><script id="hec-th0">(function(){var r=document.documentElement,t='light';try{t=localStorage.getItem('hec_theme')||'light'}catch(e){}r.setAttribute('data-theme',t==='dark'?'dark':'light');try{new MutationObserver(function(){try{localStorage.setItem('hec_theme',r.getAttribute('data-theme')||'light')}catch(e){}}).observe(r,{attributes:true,attributeFilter:['data-theme']})}catch(e){}})()</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Opening course</title>
<style>
:root{color-scheme:light;--bg:#f3efe2;--fg:#1d2a21;--fg2:#41503f;--acc:#2d6a43;--line:#d8d2bb;--card:#fbf9f1;--err:#a4262c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b09;--fg:#f2efe0;--fg2:#c8c4aa;--acc:#f0c419;--line:#2e2c1c;--card:#171712;--err:#f0a0a4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b09;--fg:#f2efe0;--fg2:#c8c4aa;--acc:#f0c419;--line:#2e2c1c;--card:#171712;--err:#f0a0a4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:17px/1.6 'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;padding:16px max(16px,env(safe-area-inset-left,0px))}
.sk{position:fixed;inset:0 0 auto 0;height:64px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}.sk i,.sk b,.skb{display:block;border-radius:10px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sh 1.3s linear infinite}.sk i{width:110px;height:34px}.sk b{width:180px;height:30px}.sk b.t{flex:1;max-width:520px}.skb{position:fixed;left:50%;transform:translateX(-50%);top:96px;width:min(900px,92vw);height:150px;border-radius:22px}@keyframes sh{to{background-position:-200% 0}}.box{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
#msg{margin:0;color:var(--fg2)}
#msg.err{color:var(--err);font-weight:600}
a{color:var(--acc);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="sk" aria-hidden="true"><i></i><b></b><b class="t"></b></div><div class="skb" aria-hidden="true"></div>
<div class="box" style="margin-top:220px">
 <div class="spin" id="spin" aria-hidden="true"></div>
 <p id="msg" role="status" data-i18n="c_opening">Opening your course…</p>
 <a id="back" href="index.html" hidden data-i18n="c_back">Back to all courses</a>
</div>
<script src="i18n.js"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
 var CFG=window.HEC_CONFIG||{};
 var I=window.HEC_I18N,t=I.t;I.apply();
 function fail(text){document.getElementById('spin').hidden=true;var m=document.getElementById('msg');m.textContent=text;m.className='err';document.getElementById('back').hidden=false}
 var slug=new URLSearchParams(location.search).get('c')||'';
 if(!/^[a-z-]{3,40}$/.test(slug))return fail(t('c_invalid'));
 if(!window.supabase||!CFG.SUPABASE_URL)return fail(t('c_noauth'));
 try{
  var sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  var s=(await sb.auth.getSession()).data.session;
  if(!s){location.replace('index.html');return}
  var r=await fetch(CFG.SUPABASE_URL+'/functions/v1/course?c='+encodeURIComponent(slug)+(I.lang!=='en'?'&lang='+I.lang:''),{headers:{Authorization:'Bearer '+s.access_token,apikey:CFG.SUPABASE_ANON_KEY}});
  if(r.status===401){location.replace('index.html');return}
  if(r.status===402){location.replace('index.html?needpay=1');return}
  if(r.status===404)return fail(t('c_missing'));
  if(!r.ok)return fail(t('c_fail'));
  var html=await r.text();
  var served=r.headers.get('x-course-lang')||'en';
  var snippet='<style>#hec-lang{position:fixed;right:12px;bottom:12px;z-index:99999;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font:600 12.5px system-ui,sans-serif}#hec-lang.inh{position:static;flex:none;flex-direction:row;align-items:center}#hec-lang.inh .note{display:none}#hec-lang .row{display:inline-flex;border:1px solid var(--line,#d8d2bb);border-radius:10px;overflow:hidden;background:var(--card,#fbf9f1);box-shadow:none}#hec-lang button{border:0;background:none;color:var(--fg2,#41503f);font:inherit;font-weight:700;padding:6px 9px;cursor:pointer}#hec-lang button[aria-pressed=true]{background:var(--acc,#2d6a43);color:var(--card,#fff)}#hec-lang .note{background:#fff3c4;color:#3a3200;border-radius:8px;padding:6px 10px;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.18)}</style>'+
   '<div id="hec-lang" role="group" aria-label="'+t('language')+'"></div><script>(function(){var L='+JSON.stringify(I.langs)+',cur='+JSON.stringify(I.lang)+',served='+JSON.stringify(served)+',note='+JSON.stringify(I.lang!==served?t('c_fallback',I.name(I.lang)):'')+';var box=document.getElementById("hec-lang");if(note){var n=document.createElement("div");n.className="note";n.textContent=note;box.appendChild(n)}var row=document.createElement("div");row.className="row";L.forEach(function(l){var b=document.createElement("button");b.type="button";b.textContent=l[1];b.title=l[2];b.setAttribute("aria-pressed",String(l[0]===cur));b.onclick=function(){try{localStorage.setItem("hec_lang",l[0])}catch(e){}location.reload()};row.appendChild(b)});box.appendChild(row);var w=document.querySelector(".top .wrap");if(w){box.classList.add("inh");w.appendChild(box)}})()<\/script>';
  html=/<\/body>\s*<\/html>\s*$/i.test(html)?html.replace(/<\/body>\s*<\/html>\s*$/i,snippet+'$&'):html+snippet;
  // Progress sync: the course pages save to window.claude's "db"/"user" when it exists. Here it is backed by this account's own rows.
  var uid=s.user.id;
  try{ if(localStorage.getItem('hec_uid')!==uid){ // another account used this browser: don't mix progress
    Object.keys(localStorage).filter(function(k){return k.indexOf('sb-')!==0}).forEach(function(k){localStorage.removeItem(k)});
    localStorage.setItem('hec_uid',uid)} }catch(e){}
  window.claude={use:function(name){
    if(name==='user')return Promise.resolve({id:function(){return Promise.resolve(uid)}});
    if(name!=='db')return Promise.resolve(null);
    return Promise.resolve({doc:function(path){
      var key=String(path).split('/').pop();
      return {
        get:function(){return sb.from('progress').select('state,updated').eq('key',key).maybeSingle().then(function(x){
          if(x.error)throw x.error;var d=x.data;return {exists:!!d,data:function(){return d?{state:d.state,updated:d.updated}:undefined}}})},
        set:function(o){return sb.from('progress').upsert({user_id:uid,key:key,state:String(o.state),updated:o.updated||Date.now()}).then(function(x){if(x.error)throw x.error})}
      }}})}};
  document.open();document.write(html);document.close(); // replaces this page with the course
 }catch(e){fail(t('c_net'))}
})();
</script>
</body>
</html>
